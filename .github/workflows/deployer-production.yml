# Production : à chaque poussée sur la branche production (fusion de la PR
# main → production) ou à la demande, construit le site avec
# SITE_ENV=production (robots.txt ouvert, sitemap, pages /dev/ exclues), à la
# racine (pas de BASE_PATH), et le livre au serveur des Bibliothèques.
#
# Le serveur est en Node 20.11 et Astro 7 exige Node 22.22 : le site est
# construit ici, et seul le résultat (dist/) part vers le serveur.
#
# Livraison :
# 1. Toujours : dist/ est publié dans la branche site-production (un seul
#    commit, remplacé à chaque build). Le serveur s'y met à jour avec :
#      git fetch origin site-production && git reset --hard origin/site-production
#    (clone initial : git clone --branch site-production --depth 1 <dépôt>)
# 2. Si les secrets sont réglés (Settings > Secrets and variables > Actions),
#    envoi direct par rsync sur SSH :
#      DEPLOY_HOST    serveur (ex. bib.umontreal.ca)
#      DEPLOY_USER    compte SSH
#      DEPLOY_PATH    dossier servi (ex. /var/www/bib)
#      DEPLOY_SSH_KEY clé privée (la clé publique dans authorized_keys du compte)
#      DEPLOY_KNOWN_HOSTS  sortie de « ssh-keyscan <serveur> »
#    Sans DEPLOY_HOST, l'étape est sautée.
#
# Le serveur doit servir …/page/index.html pour /page/ et appliquer
# public/_redirects (format Netlify), copié dans dist/.
name: Déployer en production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  construire:
    name: Construire et livrer
    runs-on: ubuntu-latest
    # Au niveau du job : le « if » d'une étape ne voit pas son propre env
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    environment:
      name: production
      url: https://bib.umontreal.ca
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Récupérer les images optimisées
        uses: actions/cache@v6
        with:
          path: node_modules/.astro/assets
          key: images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.avif', 'src/**/*.gif', 'astro.config.mjs') }}
          restore-keys: images-

      # Ni BASE_PATH ni DECAP_ORIGINE : site à la racine de bib.umontreal.ca.
      # DECAP_ORIGINE sert à la connexion de /admin/ ; en production, Decap
      # s'ouvre sur l'origine du site (le relais n8n la connaît déjà).
      - name: Construire le site
        run: npm run build
        env:
          SITE_ENV: production
          DECAP_ORIGINE: https://bib.umontreal.ca
          DECAP_AUTH_URL: https://ordo.bib.umontreal.ca/webhook/decap/auth

      # Le cache garde toutes les variantes déjà produites, même celles d'images
      # retirées ou redimensionnées : sans ménage, il grossit à chaque build
      # (513 Mo mesurés contre 43 Mo utiles) et se télécharge plus lentement
      # qu'il ne se régénère. On ne garde que les fichiers présents dans le site
      # construit (mêmes noms dans dist/_astro/). Le cache n'est réenregistré
      # que si une image ou astro.config.mjs a changé (nouvelle clé).
      - name: Élaguer le cache des images
        run: |
          avant=$(ls node_modules/.astro/assets 2>/dev/null | wc -l)
          for f in node_modules/.astro/assets/*; do
            [ -e "$f" ] && [ ! -e "dist/_astro/${f##*/}" ] && rm -f "$f"
          done
          echo "Cache des images : $avant fichiers, $(ls node_modules/.astro/assets 2>/dev/null | wc -l) gardés"

      - name: Vérifier le robots.txt de production
        run: |
          if ! grep -q '^Allow: /$' dist/robots.txt; then
            echo "::error::robots.txt n'est pas celui de production"
            cat dist/robots.txt
            exit 1
          fi

      # Un seul commit, remplacé à chaque build (pas d'historique de dist/).
      # On récupère d'abord le commit précédent (sans l'extraire) : git ne
      # renvoie alors que les fichiers qui ont changé, au lieu des ~100 Mo du
      # site, et le serveur ne télécharge lui aussi que la différence.
      - name: Publier dist/ dans la branche site-production
        env:
          DEPOT: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd dist
          git init -q -b site-production
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$DEPOT"
          git fetch -q --depth 1 origin site-production || echo "Première publication de site-production"
          git add -A
          git commit -q -m "Site construit depuis production@${GITHUB_SHA::7}"
          git push -f origin site-production

      - name: Envoyer au serveur (rsync)
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/cle && chmod 600 ~/.ssh/cle
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -az --delete --exclude .git -e "ssh -i ~/.ssh/cle" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
