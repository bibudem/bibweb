# Pré-production : construit le site (astro build) et le publie sur GitHub
# Pages, à chaque poussée sur main (dont les enregistrements de Decap CMS) ou
# à la demande (onglet Actions, « Run workflow »). Une fois la pré-production
# en ligne, ouvre (ou laisse à jour) la pull request main → production : la
# fusionner met le site en production (deployer-production.yml).
#
# Prérequis, une seule fois : Settings > Pages > Build and deployment >
# Source : « GitHub Actions ».
#
# BASE_PATH : le site est publié dans un sous-dossier
# (https://bibudem.github.io/bibweb/) ; voir src/plugins/base-sous-dossier.mjs.
#
# SITE_ENV=preprod : le robots.txt interdit l'indexation (copie de travail du
# site officiel), et les adresses canoniques restent celles de
# bib.umontreal.ca (`site` dans astro.config.mjs).
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# Un seul déploiement à la fois ; celui en cours va au bout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Astro 7 exige Node 22.22 ou plus récent (engines de package.json)
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Images déjà optimisées par Astro (avif, webp aux largeurs du site) :
      # sans ce cache, chaque build les reconvertit toutes. Après npm ci, qui
      # vide node_modules. Nouvelle clé quand une image ou la configuration
      # change ; restore-keys reprend alors le cache précédent, et seules les
      # nouvelles images sont converties.
      - name: Récupérer les images optimisées
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: images-${{ hashFiles('src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.png', 'src/**/*.webp', 'src/**/*.avif', 'src/**/*.gif', 'astro.config.mjs') }}
          restore-keys: images-

      # Donne le sous-dossier de publication (/bibweb pour bibudem/bibweb)
      - name: Préparer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construire le site
        run: npm run build
        env:
          SITE_ENV: preprod
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Adresse complète de la pré-production, pour les liens de llms.txt
          # et des pages .md (src/plugins/llms.mjs)
          ADRESSE_PUBLIQUE: ${{ steps.pages.outputs.base_url }}
          # Connexion GitHub de Decap CMS : origine du site, où s'ouvre
          # admin/connexion.html, puis relais (workflow n8n « Decap CMS :
          # connexion GitHub » sur ordo.bib.umontreal.ca)
          DECAP_ORIGINE: ${{ steps.pages.outputs.origin }}
          DECAP_AUTH_URL: https://ordo.bib.umontreal.ca/webhook/decap/auth

      # Le cache garde toutes les variantes déjà produites, même celles d'images
      # retirées ou redimensionnées : sans ménage, il grossit à chaque build
      # (513 Mo mesurés contre 43 Mo utiles) et se télécharge plus lentement
      # qu'il ne se régénère. On ne garde que les fichiers présents dans le site
      # construit (mêmes noms dans dist/_astro/). Le cache n'est réenregistré
      # que si une image ou astro.config.mjs a changé (nouvelle clé).
      - name: Élaguer le cache des images
        run: |
          avant=$(ls node_modules/.astro/assets 2>/dev/null | wc -l)
          for f in node_modules/.astro/assets/*; do
            [ -e "$f" ] && [ ! -e "dist/_astro/${f##*/}" ] && rm -f "$f"
          done
          echo "Cache des images : $avant fichiers, $(ls node_modules/.astro/assets 2>/dev/null | wc -l) gardés"

      - name: Téléverser le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Déployer
    needs: construire
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deploiement.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4

  # PR main → production. Prérequis : Settings > Actions > General >
  # « Allow GitHub Actions to create and approve pull requests ». Une PR déjà
  # ouverte suit main d'elle-même (sa tête est la branche main) : rien à faire.
  # Une PR ouverte par le GITHUB_TOKEN ne déclenche pas verifier-pr.yml ;
  # le build de pré-production qui précède sert de vérification.
  proposer-production:
    name: Proposer la mise en production
    needs: deployer
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir la pull request main → production
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$GH_REPO/branches/production" --silent 2>/dev/null; then
            echo "::error::La branche production n'existe pas : la créer depuis main (git push origin main:production)."
            exit 1
          fi
          en_avance=$(gh api "repos/$GH_REPO/compare/production...main" --jq .ahead_by)
          if [ "$en_avance" = "0" ]; then
            echo "main n'a rien de plus que production : pas de PR."
            exit 0
          fi
          ouverte=$(gh pr list --base production --head main --state open --json number --jq '.[0].number')
          if [ -n "$ouverte" ]; then
            echo "PR #$ouverte déjà ouverte : elle contient maintenant $en_avance commit(s) de main."
            exit 0
          fi
          gh pr create --base production --head main \
            --title "Mise en production" \
            --body "Changements de main pas encore en production. La pré-production les montre : ${{ needs.deployer.outputs.page_url }}

          Fusionner avec **Create a merge commit** (pas *Squash* ni *Rebase*) : main et production gardent ainsi le même historique, et la PR suivante ne montre que les nouveaux changements.

          La fusion lance la construction de production (deployer-production.yml)."
