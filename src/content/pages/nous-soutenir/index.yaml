sections:
  - type: image-texte
    disposition: encart
    teinteEncart: vert
    image: ./images/livres-rares.webp
    positionImage: droite
    titre: Cultiver la curiosité
    texte: |
      Véritable milieu de vie où se rencontre et se rassemble la communauté universitaire, les bibliothèques de l’Université de Montréal sont des partenaires essentiels au rayonnement des savoirs. Lieux où on cultive la curiosité, elles comptent parmi les grandes bibliothèques de recherche de langue française.

      En soutenant les bibliothèques de l’Université de Montréal, vous contribuez directement à multiplier les occasions d’apprentissage et de recherche pour les générations futures.

      Que ce soit en contribuant à la modernisation des espaces offerts ou à la démocratisation des savoirs, chaque don représente un pas de plus vers une science accessible et ouverte, à la communauté UdeM et aux jeunes de demain.
    boutons:
      - texte: Faire un don maintenant
        lien: https://formulairereseau.umontreal.ca/site/Donation2?df_id=1560&1560.donation=form1&mfc_pref=T&s_locale=fr_CA

  - type: liste-liens
    fond: bleu10
    titre: Projets philanthropiques en cours
    liens:
      - titre: Fonds des livres rares de l’UdeM
        description: En soutenant le Fonds des livres rares de l’Université de Montréal, vous contribuez à enrichir, à préserver et à faire connaître les collections de la Bibliothèque des livres rares et collections spéciales. Votre don appuie des projets d’acquisition, de restauration, de numérisation et d’exposition qui permettent de transmettre ce patrimoine et de le faire découvrir à un plus large public.
        lien: /nous-soutenir/fonds-livres-rares/

  - type: texte-icones
    id: services-diplomes
    titre: Des services, même après le diplôme!
    texte: Après la fin de vos études à l’UdeM, HEC Montréal et Polytechnique Montréal, les bibliothèques continuent de vous accueillir!
    couleurIcones: bleuPrincipal
    icones:
      - icone: books
        texte: Emprunt gratuit de la collection imprimée
      - icone: file-text
        texte: Accès sur place aux ressources électroniques
      - icone: chalkboard-teacher
        texte: Visites de la Bibliothèque des livres rares et collections spéciales

  - type: icone-texte
    fond: rose
    icone: heart
    couleurIcone: rose500
    titre: Remerciements
    texte: |
      Un immense merci à toutes les personnes qui contribuent à la mission des bibliothèques de l’Université de Montréal. La générosité de nos donatrices et donateurs nous permet d’enrichir l’expérience de la communauté universitaire par des projets concrets pensés en fonction de leurs besoins.

      Nous remercions chaleureusement les étudiantes et étudiants de l’UdeM pour leur contribution par l’intermédiaire des Fonds d’amélioration de la vie étudiante (FAVE) et des Frais d’amélioration des services technologiques et informatiques et des collections des bibliothèques (STIC).

      Ces fonds ont permis de créer les ateliers de fabrication numérique, de renouveler le mobilier dans nos bibliothèques et d’acquérir des outils technologiques de pointe pour soutenir la réussite étudiante. Nous avons aussi enrichi nos collections et installé des cabines insonorisées pour le travail individuel et en équipe.

      Votre soutien ouvre de nouvelles possibilités à celles et ceux qui viennent à la bibliothèque pour apprendre, créer et faire avancer la recherche.

      Merci.

  - type: image-texte
    titre: Don de livres
    texte: Les bibliothèques de l’Université de Montréal accueillent avec intérêt les propositions de don de collections spéciales ou d’ouvrages qui se distinguent par leur rareté ou leur caractère unique. Pour connaître les critères de sélection, nous vous invitons à consulter notre politique de don avant de soumettre votre proposition.
    image: ./images/don-livres.webp
    positionImage: droite
    recadrerImage: true
    boutons:
