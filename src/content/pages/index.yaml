# Page vitrine : voir docs/REDACTION.md, section « Vitrines »
title: Les bibliothèques UdeM
description: "Les 14 bibliothèques de l’Université de Montréal : espaces d’étude, collections, Sofia, aide à la recherche et formations, sur tous les campus."

