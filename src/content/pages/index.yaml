  # (« Curiosité illimitée » ou « Puissant moteur de recherche », choisi
  # pour chaque personne), affiché en accroche sous le h1 « Les
  # bibliothèques de l'Université de Montréal ». Sans JavaScript, le premier
  # portrait s'affiche.
