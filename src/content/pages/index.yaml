sections:
  - type: quoi-de-neuf
    id: quoi-de-neuf
    titre: Quoi de neuf
    nombre: 3

  # Les pages de la barre de navigation, dans le même ordre et sous le même nom
  - type: cartes-sections
    cartes:
      - fond: bleu100
        titre: Espaces
        texte: "Tout le monde s’y retrouve. Choisissez votre espace selon vos besoins du moment : horaires étendus, accès autonome, création numérique, cabine silencieuse, salon de détente… Le réseau, c’est 14 bibliothèques, chacune avec sa personnalité."
        image: ./images/espaces-alveoles.webp
        bouton:
          texte: Découvrir nos espaces
          lien: /espaces/
      - fond: bleu100
        titre: Études
        texte: "Mille et une façons d’apprendre : guides de nos spécialistes, soutien informatique, formations gratuites, Service Accessibilité et aide personnalisée, de la première à la dernière session."
        image: ./images/super-heroes/etudes.webp
        bouton:
          texte: Découvrir les services pour la communauté étudiante
          lien: /etudes/
      - fond: bleu100
        titre: Recherche
        texte: "Nos spécialistes vous accompagnent tout au long du cycle de la recherche : intelligence artificielle générative, données, synthèses des connaissances, publication et libre accès, mesure de l’impact."
        image: ./images/recherche-accueil.webp
        bouton:
          texte: Explorer les services pour la recherche
          lien: /recherche/
      - fond: bleu100
        titre: Enseignement
        texte: "Réserve de cours, droit d’auteur et déclarations dans Savia, formations dans vos cours et dans StudiUM, salles et ressources éducatives libres : notre équipe appuie votre enseignement."
        image: ./images/enseignement-accueil.webp
        bouton:
          texte: Découvrir les services pour l’enseignement
          lien: /enseignement/

  - type: image-texte
    titre: Découvrez nos pièces uniques
    texte: Nos collections spéciales forment de véritables laboratoires de recherche et de découverte. Parcourir les différents fonds, c’est découvrir le passé à travers nos livres rares et anciens, nos artefacts et nos collections d’images.
    image: ./images/collections-speciales-montage.webp
    positionImage: droite
    boutons:
      - texte: Explorer les collections spéciales
        lien: https://collections-speciales.bib.umontreal.ca/
      - texte: Découvrir la Bibliothèque des livres rares et collections spéciales
        lien: /espaces/blrcs/
        contour: true

  - type: image-fond
    image: ./images/engagement-accueil.webp
    cadrage: 15%
    titre: S’engager pour une science ouverte
    texte: Notre équipe est résolument engagée dans le développement d’un accès universel aux savoirs, par son soutien à la Politique sur le libre accès aux publications savantes et par le financement de la publication de monographies savantes en libre accès, sans parler du soutien à de multiples outils et initiatives.
    bouton:
      texte: Nos engagements
      lien: /engagements/
